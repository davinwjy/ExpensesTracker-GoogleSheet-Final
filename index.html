    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment & Bust stale Android PWA caches
      (function() {
        if (typeof window !== 'undefined') {
          try {
            var TARGET_UI_VERSION = 'wealthtrack_ui_obsidian_v2026_11_18_v9';
            var currentVersion = localStorage.getItem('wt_ui_cache_version');
            if (currentVersion !== TARGET_UI_VERSION) {
              localStorage.setItem('wt_ui_cache_version', TARGET_UI_VERSION);
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).then(function() {
                  if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                      return Promise.all(regs.map(function(r) { return r.unregister(); }));
                    }).then(function() {
                      if (!sessionStorage.getItem('wt_navy_reloaded')) {
                        sessionStorage.setItem('wt_navy_reloaded', '1');
                        window.location.reload();
                      }
                    });
                  }
                });
              }
            }
          } catch (e) {}

          // 1. Suppress console.error logging from @vite/client
          var _origErr = console.error;
          console.error = function() {
            var msg = arguments[0] ? String(arguments[0]) : '';
            if (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('vite-hmr')) {
              return;
            }
            _origErr.apply(console, arguments);
          };

          // 2. Intercept WebSocket if targeted at Vite HMR
          if (window.WebSocket) {
            var RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isVite = (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite/client'))) ||
                           protocols === 'vite-hmr' ||
                           (Array.isArray(protocols) && protocols.includes('vite-hmr'));
              if (isVite) {
                var dummy = new EventTarget();
                dummy.readyState = 1; // OPEN
                dummy.bufferedAmount = 0;
                dummy.extensions = '';
                dummy.protocol = 'vite-hmr';
                dummy.binaryType = 'blob';
                dummy.url = url;
                dummy.send = function() {};
                dummy.close = function() {};
                dummy.onopen = null;
                dummy.onclose = null;
                dummy.onerror = null;
                dummy.onmessage = null;
                setTimeout(function() {
                  if (typeof dummy.onopen === 'function') dummy.onopen({ type: 'open' });
                  dummy.dispatchEvent(new Event('open'));
                }, 10);
                return dummy;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          // 3. Catch any global error events referencing WebSocket
          window.addEventListener('error', function(event) {
            if (event && (
              (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) ||
              (event.filename && event.filename.includes('@vite/client'))
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = event.reason ? (event.reason.message || String(event.reason)) : '';
            if (reasonStr.includes('WebSocket') || reasonStr.includes('[vite]')) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        }

        // Ensure trailing slash for GitHub Pages repo subdirectories so relative ./assets resolve correctly
        if (window.location.pathname.slice(-1) !== '/' && !window.location.pathname.split('/').pop().includes('.')) {
          window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <style>
      @keyframes wtPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.96); opacity: 0.88; }
      }
      @keyframes wtSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>

        <div style="text-align: center; padding: 28px; max-width: 320px; width: 100%;">

          </div>
          <div style="display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px;">
            <h2 style="color: #fafafa; margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">WealthTrack</h2>
            <span style="font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(29, 100, 232, 0.18); border: 1px solid rgba(59, 147, 255, 0.32); color: #66b2ff; letter-spacing: 0.05em;">PRO</span>
          </div>
          <p style="margin: 0 0 18px; font-size: 12px; color: #a1a1aa;">Synchronizing personal finance ledger...</p>
          <div style="width: 140px; height: 3px; background: rgba(39, 45, 61, 0.7); border-radius: 999px; margin: 0 auto; overflow: hidden; position: relative;">
            <div style="width: 45%; height: 100%; background: linear-gradient(90deg, #1d64e8, #38bdf8); border-radius: 999px; animation: wtSlide 1.25s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
